name: Publish Play by Ear iOS 18 test feed
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_test_feed.py'
      - 'tools/build_kokoro_trailer.py'
      - 'tools/build_link_lab.py'
      - 'tools/build_companion_site.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check numpy scipy pillow mutagen qrcode kokoro-onnx soundfile
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: /tmp/play-by-ear-kokoro
          key: play-by-ear-kokoro-onnx-v1.0-release-v1.1
      - name: Fetch Apache-licensed Kokoro model for natural narration
        run: |
          mkdir -p /tmp/play-by-ear-kokoro
          if [ ! -s /tmp/play-by-ear-kokoro/kokoro-v1.0.onnx ]; then
            curl --fail --location --retry 3 --output /tmp/play-by-ear-kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          fi
          if [ ! -s /tmp/play-by-ear-kokoro/voices-v1.0.bin ]; then
            curl --fail --location --retry 3 --output /tmp/play-by-ear-kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          fi
      - name: Generate original media and Apple Podcasts feed
        run: |
          python tools/build_test_feed.py
          python tools/build_kokoro_trailer.py
          python tools/build_link_lab.py
          python tools/build_companion_site.py
      - name: Validate feed and media
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from mutagen.id3 import ID3
          from mutagen.mp3 import MP3
          base = Path('site')
          root = ET.parse(base/'feed.xml').getroot()
          items = root.findall('./channel/item')
          assert len(items) == 8, f'Expected 8 episodes including new Crossroads experiment; got {len(items)}'
          assert any(x.findtext('guid') == 'play-by-ear-trailer-2026-stable-guid' for x in items)
          assert any(x.findtext('guid') == 'play-by-ear-crossroads-link-lab-2026-v1' for x in items)
          from urllib.parse import urlparse
          import json
          lab=base/'media'/'crossroads-link-lab-v1.mp3'
          assert lab.exists()
          labtags=ID3(lab)
          assert len(labtags.getall('CHAP')) == 11
          assert all(c.sub_frames.getall('APIC') for c in labtags.getall('CHAP'))
          assert (base/'go/left.html').exists()
          assert (base/'go/right.html').exists()
          assert (base/'crossroads-link-lab.html').exists()
          assert (base/'assets/style.css').exists()
          assert len(json.loads((base/'apple-episode-links.json').read_text())['episodes']) >= 0
          for item in items:
              guid=item.find('guid')
              assert guid is not None and guid.text and guid.attrib.get('isPermaLink')=='false', 'Non-URL GUID must set isPermaLink=false'
          for p in sorted((base/'media').glob('*.mp3')):
              tags = ID3(p)
              chapters = tags.getall('CHAP')
              print(p, 'duration', round(MP3(p).info.length, 2), 'chapters', len(chapters))
              assert chapters and all(c.sub_frames.getall('APIC') for c in chapters)
          print('Feed validated with eight episodes including Kokoro trailer, Crossroads, and embedded chapter art.')
          PY
      - name: Publish generated site to gh-pages branch
        run: |
          mkdir -p /tmp/play-by-ear-published
          cp -a site/. /tmp/play-by-ear-published/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          rm -rf site tools .github README.md
          cp -a /tmp/play-by-ear-published/. .
          git add -A
          git commit -m "Publish playable podcast feed and test media"
          git push --force origin HEAD:gh-pages
